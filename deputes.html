<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos députés — Les 21 Défis</title><meta name="description" content="Les députés du parti par province."><link rel="icon" href="public/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css?v=5"></head>
<body data-page="deputes"><header id="site-header"></header><main>
<section class="hero small"><div class="container"><h1>Nos députés</h1><p class="lead">Les représentants du parti dans les 26 provinces. Seuls les députés sont publics ; les membres abonnés peuvent les suivre.</p></div></section>
<section class="section"><div class="container"><div class="stats" style="margin-bottom:40px"><div class="stat"><strong id="t-m">—</strong><span>membres</span></div><div class="stat"><strong id="t-d">—</strong><span>députés</span></div><div class="stat"><strong>26</strong><span>provinces</span></div><div class="stat"><strong id="t-p">—</strong><span>provinces représentées</span></div></div>
<div class="tabs" id="provtabs"></div><div class="grid g3" id="list"></div><p id="vide" style="display:none">Aucun député pour cette province pour l'instant.</p>
<h3 style="margin:44px 0 14px;color:var(--navy)">Répartition par province</h3><div class="tablewrap"><table class="t prov-table" id="tp"></table></div></div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script src="js/provinces.js"></script><script>
let all=[],suivis=new Set(),connecte=false,cur="";
const card=d=>`<div class="dep" style="flex-wrap:wrap"><div class="av" style="${d.photo?`background-image:url(\x27${esc(d.photo)}\x27)`:""}">${d.photo?"":esc((d.prenom[0]||"")+(d.nom[0]||""))}</div><div class="grow"><h3>${esc(d.prenom)} ${esc(d.nom)}</h3><small>${GRADE[d.grade]} · ${esc(d.province||"")}</small></div><button class="btn ${suivis.has(d.numero)?"btn-outline":"btn-red"} sm" data-s="${d.numero}">${suivis.has(d.numero)?"Abonné":"Suivre"} · <span data-ab="${d.numero}">${d.abonnes}</span></button>${d.bio?`<p style="width:100%;color:var(--muted);font-size:14px">${esc(d.bio)}</p>`:""}</div>`;
function draw(){const rows=all.filter(d=>!cur||d.province===cur);list.innerHTML=rows.map(card).join("");vide.style.display=rows.length?"none":"block";document.querySelectorAll("#provtabs button").forEach(b=>b.classList.toggle("on",b.dataset.p===cur))}
(async()=>{
 provtabs.innerHTML=["",...PROVINCES].map(p=>`<button data-p="${p}">${p||"Toutes"}</button>`).join("");
 const [s,d]=await Promise.all([api("/api/stats"),api("/api/deputes")]);all=d;
 document.getElementById("t-m").textContent=s.membres;document.getElementById("t-d").textContent=s.deputes;document.getElementById("t-p").textContent=s.provinces.filter(p=>p.deputes>0).length;
 const mx=Math.max(1,...s.provinces.map(p=>p.membres));tp.innerHTML="<tr><th>Province</th><th>Membres</th><th>Députés</th><th></th></tr>"+s.provinces.map(p=>`<tr><td><b>${p.province}</b></td><td>${p.membres}</td><td>${p.deputes}</td><td><div class="bar"><i style="width:${p.membres/mx*100}%"></i></div></td></tr>`).join("");
 try{const me=await api("/api/moi");connecte=true;suivis=new Set(me.suivis.map(x=>x.numero))}catch(e){}
 draw();
})();
document.addEventListener("click",async e=>{const t=e.target.closest("#provtabs button");if(t){cur=t.dataset.p;draw();return}
 const b=e.target.closest("button[data-s]");if(!b)return;if(!connecte){location.href="connexion.html";return}
 const n=+b.dataset.s,on=!suivis.has(n);try{const r=await api("/api/suivre",{numero:n,suivre:on});on?suivis.add(n):suivis.delete(n);all.find(x=>x.numero===n).abonnes=r.abonnes;draw()}catch(x){alert(x.message)}});
</script>
</body></html>
