<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualités — Les 21 Défis</title><meta name="description" content="Actualités, politique, visites et événements du mouvement."><link rel="icon" href="public/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css?v=9"></head>
<body data-page="news"><script src="js/loader.js"></script><header id="site-header"></header><main>
<section class="hero small"><div class="container"><h1>Actualités</h1><p class="lead">Politique, visites, événements et prises de parole du mouvement Les 21 Défis.</p></div></section>
<section class="section"><div class="container"><div class="tabs" id="tabs"><button class="on" data-c="">Tout</button><button data-c="actualite">Actualités</button><button data-c="politique">Politique</button><button data-c="visite">Visites</button><button data-c="evenement">Événements</button></div>
<div class="news" id="posts"></div><p id="vide" style="display:none">Aucun article publié pour le moment.</p></div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script>
const fd=s=>s?new Date(s).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}):"";
async function load(c){const r=await api("/api/articles"+(c?"?cat="+c:""));posts.innerHTML=r.map(a=>`<a class="post" href="article.html?id=${a.id}">${a.image?`<img src="${esc(a.image)}" alt="" loading="lazy">`:""}<div class="pb"><span class="tag">${CAT[a.categorie]}</span><span class="date">${fd(a.publie_le)}</span><h3>${esc(a.titre)}</h3><p>${esc(a.resume||"")}</p></div></a>`).join("");vide.style.display=r.length?"none":"block"}
tabs.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tabs.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));load(b.dataset.c)});load("");
</script>
</body></html>
