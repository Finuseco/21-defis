<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adhérer — 21 Défis</title><meta name="description" content="Devenez membre de 21 Défis.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="adhesion">
<header id="site-header"></header>
<main>
<section class="hero small"><div class="container"><h1 data-i18n="a.h1">Devenir membre</h1><p class="lead" data-i18n="a.lead">Remplissez le formulaire : nous vous confirmons votre adhésion rapidement.</p></div></section>
<section class="section"><div class="container layout-2">
<form class="form" id="adhesion-form" novalidate>
 <div class="row"><div class="field"><label for="prenom" data-i18n="a.fn">Prénom</label><input id="prenom" name="prenom" required autocomplete="given-name"></div>
 <div class="field"><label for="nom" data-i18n="a.ln">Nom</label><input id="nom" name="nom" required autocomplete="family-name"></div></div>
 <div class="row"><div class="field"><label for="email" data-i18n="a.em">E-mail</label><input id="email" name="email" type="email" required autocomplete="email"></div>
 <div class="field"><label for="tel" data-i18n="a.tel">Téléphone</label><input id="tel" name="telephone" type="tel" autocomplete="tel"></div></div>
 <div class="row"><div class="field"><label for="pays" data-i18n="a.co">Pays</label><input id="pays" name="pays" autocomplete="country-name"></div>
 <div class="field"><label for="ville" data-i18n="a.ci">Ville</label><input id="ville" name="ville" autocomplete="address-level2"></div></div>
 <div class="field"><label data-i18n="a.type">Type d'adhésion</label><div class="plans">
  <label class="plan"><input type="radio" name="type" value="membre" checked><strong data-i18n="a.p1">Membre</strong><span data-i18n="a.p1d">Participer et voter</span></label>
  <label class="plan"><input type="radio" name="type" value="sympathisant"><strong data-i18n="a.p2">Sympathisant</strong><span data-i18n="a.p2d">Suivre les actions</span></label>
  <label class="plan"><input type="radio" name="type" value="benevole"><strong data-i18n="a.p3">Bénévole</strong><span data-i18n="a.p3d">Donner du temps</span></label></div></div>
 <div class="field"><label for="msg" data-i18n="a.msg">Pourquoi rejoignez-vous le mouvement ? (facultatif)</label><textarea id="msg" name="message" rows="4"></textarea></div>
 <label class="check"><input type="checkbox" name="charte" required><span data-i18n="a.ch">J'adhère aux valeurs et aux statuts du mouvement.</span></label>
 <label class="check"><input type="checkbox" name="rgpd" required><span data-i18n="a.rg">J'accepte que mes données soient utilisées pour gérer mon adhésion. Je peux demander leur suppression à tout moment.</span></label>
 <button class="btn btn-primary" type="submit"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> <span data-i18n="a.send">Envoyer ma demande</span></button>
 <p id="form-status" role="status" style="margin-top:14px;font-weight:600"></p>
</form>
<aside id="soutien"><div class="card"><div class="ico"><i class="fa-solid fa-hand-holding-heart"></i></div><h3 data-i18n="a.sup">Soutenir le mouvement</h3><p data-i18n="a.supd">[À compléter] Modalités de cotisation et de don (virement, mobile money, etc.).</p></div></aside>
</div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/adhesion.js"></script>
</body></html>
