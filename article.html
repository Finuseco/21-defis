<script>
api("/api/article?id="+(new URLSearchParams(location.search).get("id")||0)).then(a=>{document.title=a.titre+" — Les 21 Défis";
 a_.innerHTML=(a.image?`<img src="${esc(a.image)}" alt="">`:"")+`<span class="tag">${CAT[a.categorie]}</span><span class="date">${new Date(a.publie_le).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</span><h1 style="color:var(--navy);margin:12px 0 18px;font-size:clamp(28px,4vw,40px);line-height:1.15">${esc(a.titre)}</h1>`+a.contenu.split(/\n{2,}/).map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("")+`<p><a href="actualites.html" style="color:var(--blue);font-weight:700">← Toutes les actualités</a></p>`}).catch(e=>{a_.innerHTML="<p>"+esc(e.message)+"</p>"});
