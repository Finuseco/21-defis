<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Les 21 Défis</title><meta name="description" content="Espace membre."><link rel="icon" href="public/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css?v=3"></head>
<body data-page="login"><header id="site-header"></header><main>
<section class="hero small"><div class="container"><h1>Espace membre</h1><p class="lead">Connectez-vous avec votre numéro de membre (ou e-mail) et votre mot de passe.</p></div></section>
<section class="section"><div class="container" style="max-width:520px"><form class="form" id="f" novalidate>
<div class="field"><label for="id">Numéro de membre ou e-mail</label><input id="id" autocomplete="username" required></div>
<div class="field"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required></div>
<button class="btn btn-red" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Se connecter</button><p id="st" style="margin-top:14px;font-weight:600;color:#b3261e"></p>
<p style="margin-top:14px;color:var(--muted)">Pas encore membre ? <a href="adhesion.html" style="color:var(--blue);font-weight:700">Adhérer</a></p></form></div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script>document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();try{await api("/api/login",{identifiant:id.value,mot_de_passe:pw.value});location.href="espace.html"}catch(x){st.textContent=x.message}})</script>
</body></html>
